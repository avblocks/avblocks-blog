<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <title id="t">Transcoder with input and output MediaSockets for AAC / ADTS encoding</title>
  <desc id="d">The input MediaSocket only has a file, input.wav. The output MediaSocket (StreamType AAC, StreamSubType AAC_ADTS, file output.aac) has a Pins socket that a MediaPin plugs into. The MediaPin holds an AudioStreamInfo with the same StreamType and StreamSubType. The input MediaSocket plugs into the Inputs socket of the Transcoder and the output MediaSocket plugs into its Outputs socket. The Transcoder then opens, runs and closes, reading input.wav and writing output.aac.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c98a4"/>
    </marker>
  </defs>

  <!-- ===== row 1: MediaPin of the output socket (20..230) ===== -->
  <rect x="700" y="20" width="260" height="210" rx="10" fill="#14181d" stroke="#4caf50" stroke-width="2"/>
  <text x="830" y="46" text-anchor="middle" font-weight="700" fill="#e8ecf0">MediaPin</text>
  <rect x="716" y="58" width="228" height="124" rx="8" fill="#1b2f20" stroke="#4caf50" stroke-width="1.5"/>
  <text x="830" y="80" text-anchor="middle" font-weight="700" fill="#e8ecf0" font-size="13">AudioStreamInfo</text>
  <g fill="#e8ecf0" font-size="12" text-anchor="middle">
    <text x="830" y="106">StreamType = AAC</text>
    <text x="830" y="125">StreamSubType = AAC_ADTS</text>
    <text x="830" y="144">Bitrate (optional)</text>
    <text x="830" y="163">SampleRate, Channels (optional)</text>
  </g>

  <!-- ===== row 2: sockets and transcoder (280..470) ===== -->

  <!-- input socket -->
  <rect x="20" y="280" width="260" height="190" rx="10" fill="#1b2a3b" stroke="#5b9bd5" stroke-width="2"/>
  <text x="150" y="344" text-anchor="middle" font-weight="700" fill="#e8ecf0">MediaSocket</text>
  <text x="150" y="364" text-anchor="middle" fill="#9fb3c8" font-size="12">input</text>
  <text x="150" y="394" text-anchor="middle" fill="#e8ecf0" font-size="13">File = input.wav</text>

  <!-- transcoder -->
  <rect x="360" y="280" width="260" height="190" rx="10" fill="#3a3118" stroke="#e0a526" stroke-width="2"/>
  <text x="490" y="344" text-anchor="middle" font-weight="700" fill="#e8ecf0">Transcoder</text>
  <g fill="#e8ecf0" font-size="13">
    <text x="386" y="399" text-anchor="start">Inputs</text>
    <text x="594" y="399" text-anchor="end">Outputs</text>
  </g>

  <!-- output socket -->
  <rect x="700" y="280" width="260" height="190" rx="10" fill="#1b2f20" stroke="#4caf50" stroke-width="2"/>
  <text x="830" y="312" text-anchor="middle" fill="#e8ecf0" font-size="13">Pins</text>
  <text x="830" y="344" text-anchor="middle" font-weight="700" fill="#e8ecf0">MediaSocket</text>
  <text x="830" y="364" text-anchor="middle" fill="#a5c9ab" font-size="12">output</text>
  <g fill="#e8ecf0" font-size="12" text-anchor="middle">
    <text x="830" y="392">StreamType = AAC</text>
    <text x="830" y="411">StreamSubType = AAC_ADTS</text>
    <text x="830" y="430">File = output.aac</text>
  </g>

  <!-- sockets on the boxes: Pins (output MediaSocket), Inputs / Outputs (Transcoder) -->
  <g fill="#14181d" stroke-width="2">
    <rect x="814" y="270" width="32" height="20" rx="5" stroke="#4caf50"/>
    <rect x="350" y="383" width="20" height="32" rx="5" stroke="#e0a526"/>
    <rect x="610" y="383" width="20" height="32" rx="5" stroke="#e0a526"/>
  </g>
  <g>
    <circle cx="830" cy="280" r="4" fill="#4caf50"/>
    <circle cx="360" cy="399" r="4" fill="#e0a526"/>
    <circle cx="620" cy="399" r="4" fill="#e0a526"/>
  </g>

  <!-- plugs: MediaPin to MediaSocket, MediaSocket to Transcoder -->
  <g stroke="#8c98a4" stroke-width="2.5" fill="none">
    <line x1="830" y1="230" x2="830" y2="270"/>
    <line x1="280" y1="399" x2="350" y2="399"/>
    <line x1="630" y1="399" x2="700" y2="399"/>
  </g>
  <g fill="#8c98a4">
    <circle cx="830" cy="230" r="5"/>
    <circle cx="280" cy="399" r="5"/>
    <circle cx="700" cy="399" r="5"/>
  </g>
  <g fill="#9aa5b1" font-size="12">
    <text x="842" y="254" text-anchor="start">add pin</text>
    <text x="315" y="385" text-anchor="middle">add input</text>
    <text x="665" y="385" text-anchor="middle">add output</text>
  </g>

  <!-- top to bottom -->
  <line x1="490" y1="470" x2="490" y2="538" stroke="#8c98a4" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ===== row 3: files and Open / Run / Close (540..620) ===== -->
  <g stroke="#8c98a4" stroke-width="1.5" fill="#232a31">
    <rect x="20" y="540" width="260" height="80" rx="10"/>
    <rect x="700" y="540" width="260" height="80" rx="10"/>
  </g>
  <rect x="360" y="540" width="260" height="80" rx="10" fill="#3a3118" stroke="#e0a526" stroke-width="2"/>
  <g fill="#e8ecf0" text-anchor="middle" font-weight="600">
    <text x="150" y="586">input.wav</text>
    <text x="830" y="586">output.aac</text>
    <text x="490" y="586">Open · Run · Close</text>
  </g>
  <g stroke="#8c98a4" stroke-width="2" fill="none" marker-end="url(#ar)">
    <line x1="280" y1="580" x2="358" y2="580"/>
    <line x1="620" y1="580" x2="698" y2="580"/>
  </g>
  <g fill="#9aa5b1" font-size="12" text-anchor="middle">
    <text x="319" y="570">read</text>
    <text x="659" y="570">write</text>
  </g>
</svg>
